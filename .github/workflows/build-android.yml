name: Build ITMA Academy Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/foto-perfil-ios, feature/actualizaciones-automaticas, pruebas/sincronizacion-web-movil]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar dependencias
        run: npm install

      - name: Preparar Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Preparar logo oficial ITMA para Android
        run: |
          set -e
          mkdir -p resources
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          source = Image.open("www/icons/ITMA LOGO.jpeg").convert("RGB")
          source = ImageOps.fit(source, (1024, 1024), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          source.save("resources/icon.png", format="PNG")
          print("Logo oficial preparado para Android:", source.size)
          PY
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Preparar firma permanente de ITMA
        env:
          ITMA_KEYSTORE_BASE64: ${{ secrets.ITMA_KEYSTORE_BASE64 }}
          ITMA_KEYSTORE_PASSWORD: ${{ secrets.ITMA_KEYSTORE_PASSWORD }}
          ITMA_KEY_ALIAS: ${{ secrets.ITMA_KEY_ALIAS }}
          ITMA_KEY_PASSWORD: ${{ secrets.ITMA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ITMA_KEYSTORE_BASE64"
          test -n "$ITMA_KEYSTORE_PASSWORD"
          test -n "$ITMA_KEY_ALIAS"
          test -n "$ITMA_KEY_PASSWORD"
          echo "$ITMA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/itma-release-key.jks"
          test -s "$RUNNER_TEMP/itma-release-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/itma-release-key.jks" -storepass "$ITMA_KEYSTORE_PASSWORD" -alias "$ITMA_KEY_ALIAS" >/dev/null
          cat >> android/app/build.gradle <<'GRADLE'

          // Firma permanente de ITMA Academy: credenciales suministradas por GitHub Secrets.
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ITMA_KEYSTORE_FILE"))
                      storePassword System.getenv("ITMA_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ITMA_KEY_ALIAS")
                      keyPassword System.getenv("ITMA_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          echo "ITMA_KEYSTORE_FILE=$RUNNER_TEMP/itma-release-key.jks" >> "$GITHUB_ENV"
          echo "ITMA_KEYSTORE_PASSWORD=$ITMA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ITMA_KEY_ALIAS=$ITMA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ITMA_KEY_PASSWORD=$ITMA_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Compilar APK firmado de publicación
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Guardar APK firmado en GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ITMA-Academy-release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK en Google Drive
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GOOGLE_DRIVE_UPLOAD_URL: ${{ secrets.GOOGLE_DRIVE_UPLOAD_URL }}
          GOOGLE_DRIVE_UPLOAD_TOKEN: ${{ secrets.GOOGLE_DRIVE_UPLOAD_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ.get("GOOGLE_DRIVE_UPLOAD_URL", "").strip()
          token = os.environ.get("GOOGLE_DRIVE_UPLOAD_TOKEN", "").strip()
          if not url or not token:
              raise SystemExit("Faltan GOOGLE_DRIVE_UPLOAD_URL y/o GOOGLE_DRIVE_UPLOAD_TOKEN.")
          with open("android/app/build/outputs/apk/release/app-release.apk", "rb") as apk:
              encoded_apk = base64.b64encode(apk.read()).decode("ascii")
          payload = json.dumps({"token": token, "apkBase64": encoded_apk}).encode("utf-8")
          request = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=180) as response:
              result = json.loads(response.read().decode("utf-8"))
          if not result.get("success"):
              raise SystemExit("Google Drive rechazó la subida: " + str(result.get("error", "error desconocido")))
          print("APK publicado correctamente en Google Drive: " + result.get("fileName", ""))
          PY
